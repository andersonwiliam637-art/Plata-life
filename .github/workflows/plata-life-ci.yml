name: Plata-life CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plata-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plata-ai/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dependency security audit
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const r=require("./audit-report.json"); for (const [name,v] of Object.entries(r.vulnerabilities || {})) { const via=(v.via || []).map(x => typeof x === "string" ? x : x.name + ": " + x.title); console.log(JSON.stringify({name,severity:v.severity,range:v.range,via,fixAvailable:v.fixAvailable})); }'
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
